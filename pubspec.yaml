name: cloudbeats
description: "CloudBeats - Google Drive Cloud Music Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  provider: ^6.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  http: ^1.3.0
  intl: ^0.20.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
